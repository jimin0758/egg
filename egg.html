<html lang="ko"><head><meta charset="utf-8">

<title>계란 던지기</title>
<meta name="theme-color" content="#e8a317">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="계란 던지기">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🥚%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#f3efe6;--ink:#2a2118;--btn:#fff;--accent:#e8a317;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1d1913;--ink:#f3efe6;--btn:#2e2820;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;overflow:hidden;touch-action:none;user-select:none}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#app{height:100%;display:flex;flex-direction:column}
#bar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;gap:8px}
#score{font-size:28px;font-weight:800}
#score small{font-size:14px;font-weight:600;opacity:.7;margin-right:6px}
.tabs{display:flex;gap:6px}
button{font:inherit;font-weight:700;border:2px solid var(--ink);background:var(--btn);color:var(--ink);border-radius:10px;padding:8px 12px}
button.on{background:var(--accent);color:#2a2118}
#stage{flex:1;min-height:0;position:relative}
canvas{position:absolute;inset:0;width:100%;height:100%}
#inst{margin:8px 14px 12px;background:var(--accent);color:#2a2118}
#help{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:24px;z-index:5}
#help .box{background:var(--bg);color:var(--ink);border-radius:16px;padding:20px;max-width:340px;line-height:1.6}
#help ol{padding-left:20px;margin:8px 0 16px}
</style></head><body>
<div id="app">
 <div id="bar"><div id="score"><small>점수</small><span id="n">0</span></div>
 <div class="tabs"><button id="b0" class="on">사진 1</button><button id="b1">사진 2</button><button id="rs">초기화</button></div></div>
 <div id="stage"><canvas id="c"></canvas></div>
 <button id="inst">📲 홈 화면에 추가</button>
</div>
<div id="help"><div class="box"><b>홈 화면에 추가하는 방법</b><ol><li>크롬 오른쪽 위 ⋮ 메뉴를 누르세요.</li><li>"홈 화면에 추가" 또는 "앱 설치"를 누르세요.</li><li>"추가"를 누르면 홈 화면에 아이콘이 생겨요.</li></ol><button id="hc">닫기</button></div></div>

 x.fillStyle='rgba(255,255,245,.8)';x.fillRect(s.x-s.r*.12,s.y,s.r*.24,s.drip);
 blob(s.x+s.r*.05,s.y,s.r*.38,'#f6b400');
 blob(s.x-s.r*.08,s.y-s.r*.1,s.r*.1,'rgba(255,255,255,.7)');
 x.globalAlpha=1}
function loop(t){x.clearRect(0,0,W,H);const f=fit();if(f)x.drawImage(f.i,f.x,f.y,f.w,f.h);
 splats=splats.filter(s=>t-s.t0<1000+300);
 splats.forEach(s=>{if(s.p!==cur)return;const age=t-s.t0;const a=age<1000?1:1-(age-1000)/300;s.drip=Math.min(s.r*1.2,age*.05);drawSplat(s,a)});
 eggs=eggs.filter(e=>{const k=(t-e.t0)/e.d;if(k>=1){splat(e.x,e.y,t);return false}
  const ex=e.sx+(e.x-e.sx)*k,ey=e.sy+(e.y-e.sy)*k-Math.sin(k*Math.PI)*90,sc=1-.45*k;
  x.save();x.translate(ex,ey);x.rotate(k*9);x.scale(sc,sc*1.25);x.fillStyle='#fbf3e0';x.strokeStyle='rgba(0,0,0,.35)';x.lineWidth=1.5;x.beginPath();x.arc(0,0,16,0,7);x.fill();x.stroke();x.restore();return true});
 requestAnimationFrame(loop)}
function splat(px,py,t){const r=32+Math.random()*14;const drops=[];for(let i=0;i<7;i++){const a=Math.random()*6.28,d=r*(.9+Math.random()*.9);drops.push({dx:Math.cos(a)*d,dy:Math.sin(a)*d,r:3+Math.random()*7})}
 splats.push({x:px,y:py,r,drops,t0:t,p:cur,drip:0});score++;n.textContent=score;if(navigator.vibrate)try{navigator.vibrate(15)}catch(e){}}
c.addEventListener('pointerdown',e=>{e.preventDefault();const r=c.getBoundingClientRect();const px=e.clientX-r.left,py=e.clientY-r.top;
 eggs.push({x:px,y:py,sx:W/2+(Math.random()-.5)*80,sy:H+20,t0:performance.now(),d:220})});
function sel(i){cur=i;b0.classList.toggle('on',i==0);b1.classList.toggle('on',i==1)}
b0.onclick=()=>sel(0);b1.onclick=()=>sel(1);
rs.onclick=()=>{score=0;n.textContent=0;splats=[]};
requestAnimationFrame(loop);

inst.onclick=async()=>{if(dp){dp.prompt();try{await dp.userChoice}catch(e){}dp=null}else help.style.display='flex'};
hc.onclick=()=>help.style.display='none';
